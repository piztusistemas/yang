set_plot_option([gnuplot_preamble, "set terminal png size 220,180; set zeroaxis;"]);
load(vect)$
/* lcm(a,b,...) vive no paquete functs, non no núcleo - sen isto queda sen avaliar, mesmo perigo có "rand" de abaixo */
load(functs)$


﻿linel:1024;display2d:false;simp:true;
/* rand(n): alias de random(n) - a IA ás veces inventa "rand", que non existe en Maxima; ver gemini_client.go */
rand([args]):=if args=[] then random(1.0) else random(args[1]);

n0():=ev(random(3)+2,simp);
n1():=ev(random(9)+2,simp);
n2():=ev(random(100)+2,simp);
sg0():=2*random(2)-1;
z0():=ev(sg0()*n0(),simp);
z1():=ev(sg0()*n1(),simp);
z2():=ev(sg0()*n2(),simp);
q0():=ev(sg0()*block([r:1],while integerp(r) do r:n0()/n0(),return(r)),simp);
q1():=ev(sg0()*block([r:1],while integerp(r) do r:n1()/n1(),return(r)),simp);
q2():=ev(sg0()*block([r:1],while integerp(r) do r:n2()/n2(),return(r)),simp);

eval(x):=ev(x,simp);
quo(P,Q,x):=divide(P,Q,x)[1];
rem(P,Q,x):=divide(P,Q,x)[2];
simplify(x):=radcan(x);
logsolve(e):=solve(radcan(e));
trigsolve(e,v):=expand(rectform(solve(exponentialize(trigexpand(e)))));
trigsolve1(e,v):=expand(solve(rectform(exponentialize(trigexpand(e)))));
trigsolve2(e,v):=expand(solve(trigreduce(e)));
trigsolve3(e,v):=expand(solve(rectform(exponentialize(trigreduce(e)))));


evalf(x,n):=float(floor(float(x)*10^n)/10^n);



texput(emptyset,"\\emptyset");
setSeed(x):=set_random_state(make_random_state(x));
getSeed():=matexe_seed;

solveineq1(ineq,x):=block([EC,sol, izq, der, r] , EC:lhs(ineq)-rhs(ineq), sol:solve(EC=0,x), if length(sol)>0 then sol:rhs(sol[1]) else sol:[],  izq:sol, der:sol, if numberp(sol) then (       if ev(EC,x=sol+1)>0 then der:inf, if ev(EC,x=sol-1)>0 then izq:-inf,  r:[izq,der]) else r:"No hay soluci?n" );

insert(L,p,x):=block([i,n,R], n:length(L), R:[], if p>n+1 then return(R:append(L,[x])), for i:1 thru p-1 do R:append(R,[L[i]]), R:append(R,[x]), for i:p thru n do R:append(R,[L[i]]), return(R) );

getpermut(n):=block([L,i,x],L:[],for i:1 thru n do (x:random(n)+1,L:insert(L,x,i)),return(L));

nrootFunc(x,y):=y^(1/x);
nroot:('('nrootFunc));
texput(nrootFunc,["\\sqrt[","}","]{"],matchfix);

LogFunc(x,y):=log(y)/log(x);
Log:('('LogFunc));
texput(LogFunc,["L_{","\\right)","}\\left("],matchfix);

solveexplicit:false;
solveradcan:true;

load1(filename):=block(if not stringp(loaded_files[filename]) then loaded_files[filename]:load(filename));

